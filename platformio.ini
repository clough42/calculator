; PlatformIO Project Configuration File for Raspberry Pi Pico
; Framework: Arduino (Earle F. Philhower, III core)

[platformio]
default_envs = pico

[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower

; Serial Monitor Options
monitor_speed = 115200

; Upload options
; upload_protocol = picotool ; or cmsis-dap, jlink, etc.

; Native environment compiles calculator, shortcut, and display mapping tests.
; main.cpp and the SPI display transport are excluded as hardware-dependent.
[env:native]
platform = native
build_src_filter = +<*> -<main.cpp> -<Tm1638Display.cpp>
test_build_src = true
