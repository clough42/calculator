; PlatformIO Project Configuration File for Raspberry Pi Pico
; Framework: Arduino (Earle F. Philhower, III core)

[platformio]
default_envs = pico

[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower

; Serial Monitor Options
monitor_speed = 115200

; Upload options
; upload_protocol = picotool ; or cmsis-dap, jlink, etc.

; Native environment: compiles hardware-independent sources (CalculatorCore)
; with the host toolchain so unit tests run on the workstation, no Pico needed.
; main.cpp is excluded because it depends on Arduino/hardware headers.
[env:native]
platform = native
build_src_filter = +<*> -<main.cpp>
test_build_src = true
